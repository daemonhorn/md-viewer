[package]
name = "md-viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["mermaid"]
# Embed mermaid.min.js (~3.5 MB) so ```mermaid blocks render offline.
# Build with `--no-default-features` for a lean binary that shows them as code.
mermaid = []

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
md-core = { version = "0.1.0-beta1", path = "../md-core" }
md-install = { version = "0.1.0-beta1", path = "../md-install" }
notify = "8.2.0"
open = "5.4.4"
percent-encoding = "2.3.2"
tao = "0.37.1"
wry = "0.57.0"

[build-dependencies]
winresource = { version = "0.1.31", default-features = false }
