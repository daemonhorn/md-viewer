name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-freebsd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute version and check against Cargo.toml
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag version $VERSION != workspace version $CARGO_VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # --- Linux ---
      - name: Install system deps (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
      - name: Install Rust (Linux/Windows)
        if: matrix.target != 'x86_64-unknown-freebsd'
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: matrix.target != 'x86_64-unknown-freebsd'
      - name: Build (Linux/Windows)
        if: matrix.target != 'x86_64-unknown-freebsd'
        run: cargo build --release --locked -p md-viewer

      # --- FreeBSD (VM) ---
      - name: Build in FreeBSD VM
        if: matrix.target == 'x86_64-unknown-freebsd'
        uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        with:
          operating_system: freebsd
          version: "14.2"
          architecture: x86-64
          shell: sh
          run: |
            set -eux
            sudo pkg install -y rust webkit2gtk4-gtk3 pkgconf
            cargo build --release --locked -p md-viewer

      - name: Package
        shell: bash
        run: |
          NAME="md-viewer-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          if [ "${{ matrix.target }}" = x86_64-pc-windows-msvc ]; then
            cp target/release/md-viewer.exe "dist/$NAME/"
          else
            cp target/release/md-viewer "dist/$NAME/"
          fi
          cp LICENSE README.md "dist/$NAME/"
          cd dist
          if [ "${{ matrix.target }}" = x86_64-pc-windows-msvc ]; then
            7z a -tzip "$NAME.zip" "$NAME" >/dev/null
          else
            tar -czf "$NAME.tar.gz" "$NAME"
          fi
          rm -rf "$NAME"
          ls -l

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  sign:
    name: checksums, SBOM, sign, attest
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write       # keyless cosign + provenance attestation
      attestations: write   # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Generate CycloneDX SBOM
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --format json --override-filename sbom
          cp crates/md-viewer/sbom.json "dist/md-viewer-${VERSION}.cdx.json"

      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum md-viewer-* > SHA256SUMS
          cat SHA256SUMS

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign every artifact and SHA256SUMS (cosign keyless)
        working-directory: dist
        run: |
          for f in md-viewer-* SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.bundle" "$f"
          done
          ls -l

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/md-viewer-*.zip
            dist/md-viewer-*.tar.gz
            dist/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: sign
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PRE=""
          case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "md-viewer $GITHUB_REF_NAME" \
            --generate-notes --verify-tag $PRE
