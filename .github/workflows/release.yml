name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned toolchain for release builds (MSRV is checked separately in CI).
  RUST_VERSION: "1.88.0"
  # Release-time policy constant. FreeBSD is an optional, best-effort target
  # during the beta: when "true" a missing FreeBSD archive only produces a loud
  # warning. Set to "false" (or delete) before 1.0 so a missing FreeBSD build
  # fails the release.
  ALLOW_MISSING_FREEBSD: "true"

jobs:
  gate:
    name: tag must be on main
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require tagged commit to be an ancestor of origin/main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not reachable from origin/main; refusing to build a release from it."
            exit 1
          fi

  build:
    name: build (${{ matrix.target }})
    needs: gate
    runs-on: ${{ matrix.os }}
    # FreeBSD (VM, unofficial webkit package names) must not block the other platforms yet.
    continue-on-error: ${{ matrix.target == 'x86_64-unknown-freebsd' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-freebsd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute version and check against Cargo.toml
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag version $VERSION != workspace version $CARGO_VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # --- Linux ---
      - name: Install system deps (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
      - name: Install Rust (Linux/Windows)
        if: matrix.target != 'x86_64-unknown-freebsd'
        shell: bash
        # No build cache in release builds (cache poisoning); pinned toolchain.
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update && rustup default "$RUST_VERSION"
      - name: Build (Linux/Windows)
        if: matrix.target != 'x86_64-unknown-freebsd'
        run: cargo build --release --locked -p md-viewer

      # --- FreeBSD (VM) ---
      - name: Build in FreeBSD VM
        if: matrix.target == 'x86_64-unknown-freebsd'
        uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        with:
          operating_system: freebsd
          version: "14.2"
          architecture: x86-64
          shell: sh
          run: |
            set -eux
            . .github/scripts/freebsd-deps.sh
            cargo build --release --locked -p md-viewer

      - name: Verify exe is a GUI-subsystem binary (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          ./.github/scripts/check-pe-gui.ps1 -SelfTest
          ./.github/scripts/check-pe-gui.ps1 target/release/md-viewer.exe

      - name: Package
        shell: bash
        run: |
          NAME="md-viewer-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          if [ "${{ matrix.target }}" = x86_64-pc-windows-msvc ]; then
            cp target/release/md-viewer.exe "dist/$NAME/"
          else
            cp target/release/md-viewer "dist/$NAME/"
          fi
          cp LICENSE README.md "dist/$NAME/"
          cd dist
          if [ "${{ matrix.target }}" = x86_64-pc-windows-msvc ]; then
            7z a -tzip "$NAME.zip" "$NAME" >/dev/null
          else
            tar -czf "$NAME.tar.gz" "$NAME"
          fi
          rm -rf "$NAME"
          ls -l

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  sbom:
    name: CycloneDX SBOM
    needs: gate
    runs-on: ubuntu-22.04
    # Deliberately NO id-token / attestations permissions: cargo-cyclonedx is
    # built from source (arbitrary crate build scripts), so it must not run in
    # a job that can mint signing identities.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update && rustup default "$RUST_VERSION"
      - name: Generate CycloneDX SBOM
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --format json --override-filename sbom
          mkdir -p sbom-out
          cp crates/md-viewer/sbom.json "sbom-out/md-viewer-${VERSION}.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom-out/*
          if-no-files-found: error

  sign:
    name: checksums, sign, attest
    needs: [build, sbom]
    runs-on: ubuntu-22.04
    # Manual approval gate: create the "release" environment with required
    # reviewers (see docs/RELEASING.md).
    environment: release
    permissions:
      contents: read
      id-token: write       # keyless cosign + provenance attestation
      attestations: write   # actions/attest-build-provenance
    # This job only downloads, checks, checksums, signs and attests. It must not
    # build or install anything from source.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: dist

      - name: Verify all expected artifacts are present
        working-directory: dist
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          missing=""
          for f in "md-viewer-${VERSION}-x86_64-pc-windows-msvc.zip" \
                   "md-viewer-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
                   "md-viewer-${VERSION}.cdx.json"; do
            [ -f "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required release artifacts:$missing"
            exit 1
          fi
          FREEBSD="md-viewer-${VERSION}-x86_64-unknown-freebsd.tar.gz"
          if [ ! -f "$FREEBSD" ]; then
            if [ "$ALLOW_MISSING_FREEBSD" = "true" ]; then
              echo "::warning::FreeBSD archive is MISSING from this release (ALLOW_MISSING_FREEBSD=true). install.sh will not work on FreeBSD for this version."
              {
                echo "## WARNING: no FreeBSD build in this release"
                echo
                echo "\`$FREEBSD\` was not produced. FreeBSD is optional during the beta"
                echo "(\`ALLOW_MISSING_FREEBSD\` in release.yml). Check the FreeBSD build job."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::$FREEBSD is missing and ALLOW_MISSING_FREEBSD is not true"
              exit 1
            fi
          fi
          # Nothing unexpected may be signed.
          for f in md-viewer-*; do
            case "$f" in
              "md-viewer-${VERSION}-x86_64-pc-windows-msvc.zip"|"md-viewer-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"|"$FREEBSD"|"md-viewer-${VERSION}.cdx.json") ;;
              *) echo "::error::Unexpected file in dist: $f"; exit 1 ;;
            esac
          done
          ls -l

      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum md-viewer-* > SHA256SUMS
          cat SHA256SUMS

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign every artifact and SHA256SUMS (cosign keyless)
        working-directory: dist
        run: |
          for f in md-viewer-* SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.bundle" "$f"
          done
          ls -l

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/md-viewer-*.zip
            dist/md-viewer-*.tar.gz
            dist/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: sign
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PRE=""
          case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "md-viewer $GITHUB_REF_NAME" \
            --generate-notes --verify-tag $PRE
