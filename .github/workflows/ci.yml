name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: fmt + clippy (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal -c rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev xvfb
      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy (Windows)
        if: runner.os == 'Windows'
        run: |
          rustup component add clippy
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a cargo test --workspace --locked
          else
            cargo test --workspace --locked
          fi
      - name: Lean build (no embedded mermaid)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test -p md-viewer --no-default-features --locked
      - name: Mermaid bundle parse check
        if: runner.os == 'Linux'
        working-directory: tests/js
        run: |
          npm install --no-save --no-package-lock jsdom@24
          node mermaid-parse.mjs

  msrv:
    name: MSRV 1.85 check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
      - run: rustup toolchain install 1.85 --profile minimal && rustup default 1.85
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --workspace --locked

  freebsd:
    name: test (FreeBSD 14, allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test in FreeBSD VM
        uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        with:
          operating_system: freebsd
          version: "14.2"
          architecture: x86-64
          shell: sh
          run: |
            set -eux
            . .github/scripts/freebsd-deps.sh
            cargo test --workspace --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  shellcheck:
    name: shellcheck (installers, scripts)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -s sh installers/install.sh installers/tests/test-install.sh .github/scripts/freebsd-deps.sh

  psscriptanalyzer:
    name: PSScriptAnalyzer (installers)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Scope CurrentUser -Force
          $findings = @(Invoke-ScriptAnalyzer -Path installers -Recurse -Severity Error, Warning -ExcludeRule PSAvoidUsingWriteHost)
          $findings | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap | Out-String -Width 200 | Write-Host
          if ($findings.Count -gt 0) { exit 1 }
      - name: Parse check (Windows PowerShell 5.1 and pwsh 7)
        run: |
          foreach ($sh in 'powershell', 'pwsh') {
            & $sh -NoProfile -File .github/scripts/parse-check.ps1 installers/install.ps1 installers/tests/test-install.ps1 .github/scripts/parse-check.ps1
            if ($LASTEXITCODE -ne 0) { throw "$sh failed to parse the installer scripts" }
          }

  installer-tests-sh:
    name: install.sh tests (fake + real cosign)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Fetch real beta1 release files (for real-cosign tests)
        run: |
          mkdir -p "$RUNNER_TEMP/real"
          base=https://github.com/daemonhorn/md-viewer/releases/download/v0.1.0-beta1
          ok=1
          for f in md-viewer-0.1.0-beta1-x86_64-unknown-linux-gnu.tar.gz SHA256SUMS; do
            for g in "$f" "$f.bundle"; do
              curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/real/$g" "$base/$g" || ok=0
            done
          done
          if [ "$ok" = 1 ]; then echo "MDV_TEST_REAL_REL=$RUNNER_TEMP/real" >> "$GITHUB_ENV"; else echo "::warning::could not fetch beta1 release; real-cosign tests skipped"; fi
      - name: Run installer tests
        run: sh installers/tests/test-install.sh installers/install.sh

  installer-tests-ps:
    name: install.ps1 tests (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run installer tests
        shell: pwsh
        run: ./installers/tests/test-install.ps1 -Installer ./installers/install.ps1 -Shell ${{ matrix.shell }}
