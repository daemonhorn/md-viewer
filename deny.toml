# cargo-deny configuration. Run: cargo deny check
[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-freebsd",
]

[advisories]
version = 2
yanked = "deny"
# Every ignore needs a reason and a removal condition. Do not add ignores for
# exploitable vulnerabilities in code paths this project reaches.
ignore = [
    # RUSTSEC-2026-0009 (time <0.3.47, RFC 2822 parsing stack exhaustion).
    # time is pulled in only by wry -> cookie and by syntect -> plist; neither
    # parses attacker-controlled RFC 2822 dates. The fix (time >= 0.3.47)
    # requires rustc 1.88, but the workspace MSRV is 1.85, so `cargo update -p
    # time` would break the MSRV job. REMOVE this ignore (and run `cargo update
    # -p time`) when the MSRV is raised to >= 1.88.
    { id = "RUSTSEC-2026-0009", reason = "unreachable RFC 2822 parsing; fix needs rustc 1.88 > MSRV 1.85" },
    # RUSTSEC-2025-0141 bincode 1.x is "unmaintained" (no vulnerability), used
    # by syntect for its bundled syntax dumps. Remove when syntect drops it.
    { id = "RUSTSEC-2025-0141", reason = "unmaintained only (no vulnerability); transitive via syntect" },
    # RUSTSEC-2024-0370 proc-macro-error is "unmaintained" (no vulnerability),
    # a build-time proc-macro dependency of gtk3-macros/glib-macros (gtk-rs 0.18,
    # via wry/tao). Never linked into the shipped binary. Remove when wry/tao
    # move to gtk4-rs-free backends or newer gtk-rs.
    { id = "RUSTSEC-2024-0370", reason = "unmaintained only; build-time proc-macro via gtk3-macros" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "MITNFA", # fmt2io (via comrak): MIT without the no-false-attribs-clause restrictions on use
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
