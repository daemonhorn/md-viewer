[workspace]
resolver = "2"
members = ["crates/md-core", "crates/md-install", "crates/md-viewer"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "BSD-2-Clause"
repository = "https://github.com/daemonhorn/md-viewer"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
